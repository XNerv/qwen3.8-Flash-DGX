name: Publish arm64 image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "results/**", "bench/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The base vLLM image is arm64 (Spark's Grace CPU), so build on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The vLLM base image is tens of GB; reclaim runner disk before building.
      # Only paths that exist on the ubuntu-24.04-arm image are listed; each removal is logged.
      - name: Free disk space
        run: |
          echo "Before:"
          df -h /
          for p in /usr/share/dotnet /opt/hostedtoolcache /home/linuxbrew; do
            if [ -e "$p" ]; then
              echo "Removing $p"
              sudo rm -rf "$p"
            fi
          done
          echo "After:"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qwen3.8-flash-next-gb10-vllm
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
